# Install as .github/workflows/qrh.yml in the publication repository.
# The published package lives at routes/qrh/.
# Official action inputs checked on 2026-11-06:
# https://github.com/leanprover/lean-action/blob/fe408643ea7367d8c0404a8be3975bb145f5fb64/action.yml
# All action revisions below are full commit SHAs resolved from their official repositories.
# A green run verifies the stated computations and downstream conditional proof.
# It does NOT certify an end-to-end theorem from QRH(7/8) and CS v2 alone.

name: QRH route verification (current k6)

on:
  push:
    paths:
      - "routes/qrh/**"
      - ".github/workflows/qrh.yml"
  pull_request:
    paths:
      - "routes/qrh/**"
      - ".github/workflows/qrh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  numerical-certificates:
    name: Numerical certificates and generated-source consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: routes/qrh
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"

      # This precedes package regeneration, result writes, and Lean cache creation.
      - name: Check frozen release bytes before any verification writes
        run: |
          set -euo pipefail
          python -B code/release_manifest.py --check | tee "$RUNNER_TEMP/k6-manifest-before.log"

      - name: Install pinned numerical dependency
        run: python -m pip install --requirement code/requirements.txt
        # code/requirements.txt pins python-flint==0.9.0.

      # The historical tail checker compares the complete saved metadata too.
      # Its original certificate records Python 3.12.10, so pin that patch version.
      - name: Check strict tail-certificate reproducibility before the longer replay
        run: |
          set -euo pipefail
          python -B code/certify_tail_cs.py --verify | tee "$RUNNER_TEMP/k6-tail-preflight.log"

      - name: Replay all four certificates without replacing their summary
        run: |
          set -euo pipefail
          python -B code/verify_k6.py --dry-run | tee "$RUNNER_TEMP/k6-numerical-replay.log"

      - name: Run the independent selected-cell implementation
        run: |
          set -euo pipefail
          python -B code/review_smooth_k6_refined.py | tee "$RUNNER_TEMP/k6-independent-replay.log"

      - name: Check deterministic generated Lean certificates
        run: |
          set -euo pipefail
          python -B code/generate_lean_certificates.py --check | tee "$RUNNER_TEMP/k6-generator-check.log"
          python -B code/generate_m2_pilot.py --all-blocks --check
          python -B code/generate_m2_factor_bounds.py --check
          python -B code/generate_m2_integer_data.py --check
          python -B code/generate_m3_far.py --all-blocks --check
          python -B code/generate_m3_far_factor_bounds.py --check
          python -B code/generate_m3_far_integer_data.py --check

      - name: Confirm that the saved release files stayed unchanged
        run: |
          set -euo pipefail
          python -B code/release_manifest.py --check | tee "$RUNNER_TEMP/k6-manifest-after.log"

      - name: Record the numerical verification scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Numerical certificates, selected independent recomputations, and generated-source consistency passed.

          The theorem remains conditional on the explicitly listed literature inputs.
          Arb replay and deterministic source regeneration are not an end-to-end Lean proof.
          EOF

      - name: Upload numerical replay logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qrh-numerical-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/k6-manifest-before.log
            ${{ runner.temp }}/k6-tail-preflight.log
            ${{ runner.temp }}/k6-numerical-replay.log
            ${{ runner.temp }}/k6-independent-replay.log
            ${{ runner.temp }}/k6-generator-check.log
            ${{ runner.temp }}/k6-manifest-after.log
          if-no-files-found: warn
          retention-days: 30

  lean-modules:
    name: Full downstream Lean proof and exact-input audit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    defaults:
      run:
        shell: bash
        working-directory: routes/qrh
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10 for the audit driver
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"

      # Check the committed bytes before installing the read-only dependencies.
      # Check the committed snapshot first, while those bytes are still untouched.
      - name: Check frozen release bytes before installing/building Lean dependencies
        run: |
          set -euo pipefail
          python -B code/release_manifest.py --check | tee "$RUNNER_TEMP/k6-lean-manifest-before.log"

      - name: Prepare the pinned Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: routes/qrh/lean
          use-mathlib-cache: "true"
          use-github-cache: "true"
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          mk_all-check: "false"

      - name: Provide swap for exact kernel arithmetic
        run: |
          set -euo pipefail
          # Exact rational normalization has a recorded high-memory module.
          # This file exists only on the disposable GitHub runner.
          free -h
          df -h "$RUNNER_TEMP"
          sudo fallocate -l 8G "$RUNNER_TEMP/k6-kernel.swap"
          sudo chmod 600 "$RUNNER_TEMP/k6-kernel.swap"
          sudo mkswap "$RUNNER_TEMP/k6-kernel.swap"
          sudo swapon "$RUNNER_TEMP/k6-kernel.swap"

      # Compile every local module into a new output tree, including print-only
      # audits. No development olean is on this build's search path.
      - name: Compile every present module and capture kernel axioms and theorem parameters
        run: |
          set -euo pipefail
          python -B code/build_lean.py --jobs 1 \
            --build-root "$RUNNER_TEMP/k6-clean-lib" \
            --report-root "$RUNNER_TEMP/k6-clean-audit" | tee "$RUNNER_TEMP/k6-lean-driver.log"
          python -B code/run_dependency_audit.py \
            --build-report "$RUNNER_TEMP/k6-clean-audit/lean_build_report.json" \
            --output-dir "$RUNNER_TEMP/k6-clean-audit"

      - name: Check the audit scope and retain only fresh reports
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          fresh = Path(os.environ["RUNNER_TEMP"]) / "k6-clean-audit"
          report = json.loads((fresh / "lean_build_report.json").read_text(encoding="utf-8"))
          assert report["status"] == "ALL_PRESENT_LEAN_MODULES_COMPILED"
          assert report["end_to_end_H1_H2_formalization"] is False
          sources = {
              ".".join(p.relative_to("lean").with_suffix("").parts)
              for p in Path("lean").rglob("*.lean") if ".lake" not in p.parts
          }
          rows = report["modules"]
          assert len(rows) == len(sources)
          assert {row["module"] for row in rows} == sources
          assert all(row["exit_code"] == 0 and row["status"] == "PASS" for row in rows)
          assert all(row["olean_existed_before"] is False for row in rows)
          assert {"LegendreK6.Audit", "LegendreK6.CoreAudit"} <= sources
          evidence = (fresh / "kernel_axioms.txt").read_text(encoding="utf-8")
          assert "sixth_powers_from_named_inputs" in evidence
          assert "sorryAx" not in evidence and "Lean.ofReduceBool" not in evidence
          dependency_report = json.loads((fresh / "final_dependency_report.json").read_text(encoding="utf-8"))
          assert dependency_report["status"] == "FINAL_K6_DEPENDENCY_AUDIT_PASSED"

          target = Path(os.environ["RUNNER_TEMP"]) / "k6-current-lean-audit"
          target.mkdir(exist_ok=True)
          for name in ("lean_build_report.json", "lean_build.log", "kernel_axioms.txt",
                       "final_dependencies.txt", "final_dependency_report.json"):
              shutil.copy2(fresh / name, target / name)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"All {len(rows)} present Lean modules compiled and the explicit-parameter audit passed.\n\n")
              summary.write("**Complete downstream k=6 derivation relative to seven named external inputs.** No local analytic-segment or numerical-budget conclusion is a final theorem parameter. The stronger QRH/CS-only scope remains distinct.\n")
          print(f"ALL_{len(rows)}_PRESENT_MODULES_AUDITED; FINAL_NAMED_INPUT_DERIVATION_CHECKED")
          PY

      # Use RUNNER_TEMP, not committed audit files: if this run fails before the
      # driver succeeds, no stale report from the release is uploaded as new evidence.
      - name: Upload current Lean compilation and scope evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qrh-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/k6-lean-manifest-before.log
            ${{ runner.temp }}/k6-lean-driver.log
            ${{ runner.temp }}/k6-clean-audit/
            ${{ runner.temp }}/k6-current-lean-audit/
          if-no-files-found: warn
          retention-days: 30
